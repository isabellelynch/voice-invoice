spring.application.name=voice-invoice-api

# H2 database stored in a file, so drafts survive a restart. The data/ folder is git-ignored.
spring.datasource.url=jdbc:h2:file:./data/voiceinvoice
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080
